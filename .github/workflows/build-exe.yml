name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'          # 当推送以 v 开头的标签时触发
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "VideoAudioMerger" merge_audio_gui.py

      - name: Upload artifact (for testing)
        uses: actions/upload-artifact@v3
        with:
          name: VideoAudioMerger-exe
          path: dist/VideoAudioMerger.exe

      - name: Create Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" dist/VideoAudioMerger.exe --title "${GITHUB_REF#refs/tags/}" --notes "自动构建的 Windows 可执行文件"
        shell: bash
