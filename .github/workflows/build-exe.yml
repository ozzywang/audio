name: Build Windows EXE

on:
  workflow_dispatch:          # 允许手动触发
    inputs:
      create_release:
        description: '是否创建 Release（输入 true 或 false）'
        required: true
        default: 'true'
  push:
    tags:
      - 'v*'                  # 推送标签时自动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "VideoAudioMerger" merge_audio_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: VideoAudioMerger-exe
          path: dist/VideoAudioMerger.exe

      # 如果是手动触发且用户选择创建 Release，或者推送了标签，则执行以下步骤
      - name: Create Tag (if manual and create_release = true)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        run: |
          # 生成一个基于时间的标签，避免冲突
          TAG_NAME="v$(date +'%Y%m%d%H%M%S')"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Create Release
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 确定标签名称：手动触发时使用刚刚创建的标签，否则使用当前推送的标签
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG_NAME="${{ env.TAG_NAME }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          echo "Creating release for tag: $TAG_NAME"
          gh release create "$TAG_NAME" dist/VideoAudioMerger.exe --title "$TAG_NAME" --notes "自动构建的 Windows 可执行文件"
        shell: bash
